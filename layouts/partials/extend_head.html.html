<!-- Open Graph / Facebook -->
<meta property="og:type" content="article">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:title" content="{{ .Title }}">
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Summary }}{{ end }}">
<meta property="og:site_name" content="End Sexual Violence">
{{ if .Params.cover.image }}
<meta property="og:image" content="{{ .Params.cover.image | absURL }}">
{{ else }}
<meta property="og:image" content="{{ "/images/endsv-logo.jpg" | absURL }}">
{{ end }}

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:url" content="{{ .Permalink }}">
<meta name="twitter:title" content="{{ .Title }}">
<meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Summary }}{{ end }}">
{{ if .Params.cover.image }}
<meta name="twitter:image" content="{{ .Params.cover.image | absURL }}">
{{ else }}
<meta name="twitter:image" content="{{ "/images/endsv-logo.jpg" | absURL }}">
{{ end }}
